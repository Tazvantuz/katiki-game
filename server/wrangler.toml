name = "katiki-game"
main = "src/index.js"
compatibility_date = "2023-10-01"

# Настройки Durable Objects для игровых комнат
[[durable_objects.bindings]]
name = "GAME_ROOM"
class_name = "GameRoom"

# Миграция для бесплатного плана: используем SQLite-бэкенд
[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom"]

# Настройки базы данных D1 для пользователей
[[d1_databases]]
binding = "DB"
database_name = "katiki-db"
database_id = "6b521fa3-097d-42be-8f5d-92439a3d7b96"